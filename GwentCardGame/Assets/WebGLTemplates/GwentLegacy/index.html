<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <!-- The game fills the window on every device, on the game's dark background (no page around it). On a phone a tap
         goes fullscreen and turns to landscape where the browser allows it (Android); elsewhere (an iPhone) the page asks
         for the phone to be turned. Added to the home screen, the manifest opens it fullscreen, in landscape. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#16120E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="{{{ PRODUCT_NAME }}}">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="manifest" href="TemplateData/manifest.webmanifest">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading">
        <div id="unity-loading-icon"></div>
        <div id="unity-progress"><div id="unity-progress-full"></div></div>
      </div>
      <div id="unity-warning"></div>
      <div id="ios-hint">To play full screen: <b>Share</b>, then <b>Add to Home Screen</b><span id="ios-hint-close">&times;</span></div>
      <div id="rotate">
        <div id="rotate-phone"></div>
        <div id="rotate-title">Turn your phone sideways</div>
        <div id="rotate-detail">The game plays in landscape</div>
      </div>
    </div>
    <script>
      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent)); // an iPad asks for the desktop site
      if (mobile)
        document.documentElement.classList.add("mobile");

      // On a phone, a tap (the browser allows it only then) goes fullscreen and locks landscape; the next tap does it
      // again after the player left fullscreen. Browsers that can't (an iPhone) keep the page as it is: the prompt
      // asks for the phone to be turned until it is.
      function playFullscreen() {
        const page = document.documentElement;
        const inFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
        const request = page.requestFullscreen || page.webkitRequestFullscreen;
        let entered = Promise.resolve();
        if (!inFullscreen && request) {
          try {
            entered = Promise.resolve(request.call(page, { navigationUI: "hide" }));
          } catch (e) {
            return;
          }
        }
        entered.then(() => {
          if (screen.orientation && screen.orientation.lock)
            return screen.orientation.lock("landscape");
        }).catch(() => {});
      }
      if (mobile) {
        document.addEventListener("pointerup", playFullscreen);
        document.querySelector("#rotate").addEventListener("pointerup", playFullscreen);
      }

      // An iPhone's Safari can't go fullscreen (only an iPad's can): once, the way that can, the home screen (the manifest
      // opens it fullscreen there). Not when it was opened from there already.
      function showIosHint() {
        const iphone = /iPhone|iPod/i.test(navigator.userAgent);
        const installed = navigator.standalone || window.matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches;
        let seen = false;
        try { seen = localStorage.getItem("gwent-ios-hint") == "1"; } catch (e) {}
        if (!iphone || installed || seen)
          return;
        try { localStorage.setItem("gwent-ios-hint", "1"); } catch (e) {}
        const hint = document.querySelector("#ios-hint");
        hint.classList.add("shown");
        const hide = () => hint.classList.remove("shown");
        hint.addEventListener("pointerup", hide);
        setTimeout(hide, 10000);
      }

      // Unity's notices (a warning for a few seconds, an error until the page reloads), at the top in the game's colours
      function unityShowBanner(msg, type) {
        const banner = document.querySelector("#unity-warning");
        const div = document.createElement("div");
        div.innerHTML = msg;
        div.className = type == "error" ? "error" : "warning";
        banner.appendChild(div);
        banner.style.display = "block";
        if (type != "error")
          setTimeout(() => {
            banner.removeChild(div);
            banner.style.display = banner.children.length ? "block" : "none";
          }, 5000);
      }

      const buildUrl = "Build";
      const config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-container", // the game's own Fullscreen switch (Settings > Display, on a computer)
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      const script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = () => {
        const loading = document.querySelector("#unity-loading");
        const progress = document.querySelector("#unity-progress-full");
        createUnityInstance(canvas, config, (value) => {
          progress.style.width = 100 * value + "%";
        }).then(() => {
          loading.style.display = "none";
          showIosHint();
        }).catch((message) => {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
