# Every push to main is a release: the tests, then the five builds, then the one GitHub release ("latest") replaced by
# the new one, its notes taken from the newest section of CHANGELOG.md, and the web build published on GitHub Pages
# (https://usersina.github.io/gwent-legacy/, the repository's Pages source set to GitHub Actions), with the update feed
# beside it (version.json: the build number, the notes, each archive's link, size and checksum; the game checks it). Nothing is
# published unless all of it succeeds, and a push whose CHANGELOG.md has no new section since the last release is not
# released at all: its run only checks the changelog, skips the rest and passes.
#
# Secrets (tools/release-secrets.sh sets them): UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD; for an Android release key,
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS (without them the APK is signed with
# a throwaway debug key, and does not install over the previous one).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; a push made during a release waits for it
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: GwentCardGame

jobs:
  prepare:
    name: Changelog
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.changelog.outputs.release }}
      version_code: ${{ steps.code.outputs.version_code }}
      build_stamp: ${{ steps.code.outputs.build_stamp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md has a new section since the last release
        id: changelog
        run: |
          python3 .github/scripts/release_notes.py CHANGELOG.md
          if git rev-parse -q --verify refs/tags/latest >/dev/null && git diff --quiet latest "$GITHUB_SHA" -- CHANGELOG.md; then
            echo "::notice::CHANGELOG.md has not changed since the last release: nothing to release, the tests and builds are skipped."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      # The build number every platform's build carries (BuildStamp): the commit, given to the builds, which run where
      # git may not
      - name: Android version code (the number of commits, so every release installs over the one before) and build number
        id: code
        run: |
          echo "version_code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_stamp=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

  # Skipped when there is nothing to release, and the builds and the release with it
  test:
    name: Tests
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # the test runner posts the results as a check on the commit
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      # No Library cache (see the builds)
      - uses: actions/checkout@v4
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT }}
          testMode: editmode

  build:
    name: Build ${{ matrix.name }}
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # A build that fails leaves the others running: re-running the failed jobs then rebuilds only that one, and the
      # release still waits for all five
      fail-fast: false
      matrix:
        include:
          - { name: linux, target: StandaloneLinux64 }
          - { name: windows, target: StandaloneWindows64 }
          - { name: macos, target: StandaloneOSX }
          - { name: android, target: Android }
          - { name: web, target: WebGL }
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      # No Library cache, here or for the tests: started on a Library restored from an earlier run, the editor was killed
      # (exit code 137) within its first seconds, 4 times out of 6; started on an empty one, every build and test run
      # went through. A release then takes about half an hour (each build 10 to 20 minutes).
      - uses: actions/checkout@v4
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT }}
          targetPlatform: ${{ matrix.target }}
          # The game's own build: GwentBuild builds and packages it into Builds/<version>/GwentLegacy-<platform>.*
          buildMethod: Gwent.EditorTools.GwentBuild.BuildAllBatch
          customParameters: -buildTargets ${{ matrix.name }} -buildStamp ${{ needs.prepare.outputs.build_stamp }} -buildNumber ${{ needs.prepare.outputs.version_code }}
          versioning: None
          androidVersionCode: ${{ needs.prepare.outputs.version_code }}
          androidKeystoreName: ${{ matrix.name == 'android' && secrets.ANDROID_KEYSTORE_BASE64 != '' && 'gwentlegacy.keystore' || '' }}
          androidKeystoreBase64: ${{ matrix.name == 'android' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          androidKeystorePass: ${{ matrix.name == 'android' && secrets.ANDROID_KEYSTORE_PASS || '' }}
          androidKeyaliasName: ${{ matrix.name == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          androidKeyaliasPass: ${{ matrix.name == 'android' && secrets.ANDROID_KEY_PASS || '' }}
      - name: Build report
        if: always()
        run: cat ${{ env.PROJECT }}/Builds/*/build-report.txt || true
      # The archive on its own, without the Builds/<version>/ folders it was made in: the release lists them flat.
      # Copied, not moved: the build ran as root in its container, and the runner may read its files but not move them.
      - name: Collect the archive
        run: |
          mkdir dist
          cp ${{ env.PROJECT }}/Builds/*/GwentLegacy-* dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: assets
      - name: Notes
        run: python3 .github/scripts/release_notes.py CHANGELOG.md assets "$GITHUB_REPOSITORY" > notes.md
      # The update feed, made from the archives as released (an asset too: a feed for any copy of the game)
      - name: Update feed
        run: |
          python3 .github/scripts/version_json.py CHANGELOG.md assets "$GITHUB_REPOSITORY" \
            "${{ needs.prepare.outputs.version_code }}" "$GITHUB_SHA" > version.json
          cat version.json | head -c 600
      - uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.json
          retention-days: 3
      - name: Replace the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest assets/* version.json \
            --target "$GITHUB_SHA" \
            --title "Gwent Legacy" \
            --notes-file notes.md \
            --latest

  # The web build, as released, played in the browser: the site is the archive unpacked (its index.html at the top)
  pages:
    name: Web on GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-web
          path: web
      - uses: actions/download-artifact@v4
        with:
          name: version
          path: feed
      - name: Unpack the web build
        run: |
          mkdir site
          unzip -q web/GwentLegacy-Web.zip -d site
          test -f site/index.html
          cp feed/version.json site/version.json
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
